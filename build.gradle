plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

def mod_version = project.property('mod_version')

def fabric_version = project.property('fabric_version')

def minecraft_version = project.property('minecraft_version')

def maven_group = project.property('maven_group')

def archives_base_name = project.property('archives_base_name')

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Maven'
        url = 'https://repo.maven.apache.org/maven2/'
    }
}

loom {
    minecraftVersion = minecraft_version
    mappings = 'official'
    runDir = "run"
    accessWidener = 'src/main/resources/performanceoptimizer.accesswidener'
    ide {
        runDir = "run"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.91.0+1.21.1"
    include "com.google.guava:guava:32.1.3-jre"
    include "it.unimi.dsi:fastutil:8.5.12"
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include "**/*.json"
        include "**/*.png"
        expand([project: project])
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "**/*.json"
        exclude "**/*.png"
    }
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

project.ext.version = mod_version
project.ext.mcversion = minecraft_version

sourceCompatibility = JavaVersion.VERSION_17

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
}